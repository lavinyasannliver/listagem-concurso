<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portal de consulta de classificações dos processos de Tombos/MG.">
  <title>Classificações — Tombos/MG</title>
  <style>
    :root { --ink:#183247; --muted:#617889; --line:#dce7ed; --page:#f3f7fa; --brand:#145a70; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; padding:32px 16px; background:var(--page); color:var(--ink); font-family:Inter,"Segoe UI",system-ui,sans-serif; }
    main { max-width:820px; margin:6vh auto 0; }
    header { position:relative; overflow:hidden; padding:34px; border-radius:20px; color:white; background:linear-gradient(125deg,#103e56 0%,#176a7c 72%,#278b91 100%); box-shadow:0 14px 35px rgb(16 62 86 / 14%); }
    header::after { content:""; position:absolute; width:230px; height:230px; right:-70px; top:-125px; border:1px solid rgb(255 255 255 / 18%); border-radius:50%; box-shadow:0 0 0 30px rgb(255 255 255 / 5%),0 0 0 65px rgb(255 255 255 / 3%); }
    header p { margin:0; color:rgb(255 255 255 / 82%); line-height:1.6; }
    header p:first-child { font-size:12px; font-weight:750; letter-spacing:.12em; }
    h1 { position:relative; z-index:1; margin:10px 0; font-size:clamp(29px,5vw,42px); letter-spacing:-.03em; }
    .links { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px; margin-top:20px; }
    .links a { display:flex; min-height:112px; align-items:center; justify-content:space-between; gap:16px; padding:22px; border:1px solid var(--line); border-radius:16px; background:#fff; color:#14536a; text-decoration:none; font-weight:750; line-height:1.5; box-shadow:0 6px 20px rgb(23 53 77 / 4%); transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease; }
    .links a::after { content:"↗"; flex:none; display:grid; width:32px; height:32px; place-items:center; border-radius:10px; background:#e8f4f7; color:#145a70; font-size:18px; }
    .links a:hover,.links a:focus-visible { transform:translateY(-2px); border-color:#8dbbc7; box-shadow:0 10px 26px rgb(23 53 77 / 9%); outline:none; }
    footer { margin:30px auto 0; padding:18px 8px; color:#728895; text-align:center; font-size:12px; }
    footer strong { color:#31586b; }
    @media(max-width:520px) { body { padding:18px 12px; } main { margin-top:3vh; } header { padding:25px 22px; border-radius:16px; } .links { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p>CONSULTA • TOMBOS/MG • 2026</p>
      <h1>Classificações</h1>
      <p>Escolha qual lista deseja consultar.</p>
    </header>
    <nav class="links" aria-label="Listas de classificação">
      <a href="concurso/index.html">Concurso Público — Edital 01/2026</a>
      <a href="processo-seletivo/index.html">Processo Seletivo — Edital 02/2026</a>
    </nav>
  </main>
  <footer style="text-align:center;color:#66808c;font-size:13px;padding:18px;">Projeto desenvolvido por <strong>Lavinya Sannliver</strong></footer>
</body>
</html>
